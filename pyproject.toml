[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monetary-policy-dashboard"
version = "0.1.0"
description = "Auditable monetary-policy dashboard with Taylor-rule benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Monetary Policy Dashboard contributors" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
